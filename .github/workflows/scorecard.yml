name: OpenSSF Scorecard

# Continuously scores this repository against the OpenSSF Scorecard checks
# (branch-protection, code-review, dependency-update-tool, sast, signed-releases,
# pinned-dependencies, token-permissions, dangerous-workflow, etc.) and uploads
# its SARIF result to GitHub code scanning. Direct scorecard.dev publication is
# intentionally disabled below until its public badge is restored.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Mondays 07:23 UTC. Decoupled from CodeQL's slot to spread runner load.
    - cron: "23 7 * * 1"
  workflow_dispatch:

# Workflow-level permissions are intentionally minimal. The OpenSSF
# Scorecard canonical example uses `read-all`, but the analysis job
# below already declares the specific scopes it needs (security-events:
# write for SARIF and contents/actions read for repo metadata).
# Workflow-level scope only acts as the
# default for jobs that don't explicitly declare their own; keeping
# it at `contents: read` ensures any future job added without explicit
# permissions inherits a safe, narrow default rather than `read-all`.
permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required to upload SARIF to GitHub code scanning so findings show up
      # under the Security tab alongside CodeQL.
      security-events: write
      # Required by Scorecard to read repository metadata and Actions runs.
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish disabled 2026-05-16 — the Scorecard badge was removed from
          # README in v1.0.10 ("until the public score catches up with the
          # repository's intended trust posture"). Until the badge is restored,
          # the scorecard.dev publish step adds no user-visible value but was
          # generating a weekly failure email (id-token / Sigstore handshake
          # against scorecard.dev). SARIF still uploads to GitHub code scanning
          # below, so internal findings remain visible under the Security tab.
          publish_results: false

      # Persist the raw SARIF for 30 days. Useful for diffing checks across
      # weekly runs without round-tripping through code scanning.
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30

      - name: Upload to GitHub code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: ossf-scorecard
